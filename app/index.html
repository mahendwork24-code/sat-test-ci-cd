
<!DOCTYPE html>
<html>
<head>
<title>Colorful Registration Form</title>
</head>

<body style="margin:0; padding:30px; font-family:Arial,sans-serif; background:linear-gradient(135deg,#667eea,#764ba2,#ff758c); min-height:100vh; display:flex; justify-content:center; align-items:center;">

<div style="width:700px; max-width:100%; background:#ffffff; padding:30px; border-radius:20px; box-shadow:0 15px 40px rgba(0,0,0,0.3);">

<h1 style="text-align:center; color:#764ba2; margin-bottom:5px;">✨ Create Your Account</h1>

<p style="text-align:center; color:#888; margin-bottom:25px;">Join us today! Fill in your details below.</p>

<form>

<table style="width:100%; border-spacing:0 12px;">

<tr style="background:#f3e8ff;">
<td style="padding:13px; font-weight:bold; color:#6b21a8; border-radius:8px 0 0 8px;">👤 Full Name</td>
<td style="padding:10px; border-radius:0 8px 8px 0;">
<input type="text" placeholder="Enter your full name" required style="width:95%; padding:12px; border:2px solid #d8b4fe; border-radius:8px; box-sizing:border-box; outline:none;">
</td>
</tr>

<tr style="background:#e0f2fe;">
<td style="padding:13px; font-weight:bold; color:#0369a1; border-radius:8px 0 0 8px;">📱 Mobile Number</td>
<td style="padding:10px;">
<input type="tel" placeholder="Enter mobile number" maxlength="10" required style="width:95%; padding:12px; border:2px solid #7dd3fc; border-radius:8px; box-sizing:border-box;">
</td>
</tr>

<tr style="background:#dcfce7;">
<td style="padding:13px; font-weight:bold; color:#15803d; border-radius:8px 0 0 8px;">📧 Email Address</td>
<td style="padding:10px;">
<input type="email" placeholder="Enter your email" required style="width:95%; padding:12px; border:2px solid #86efac; border-radius:8px; box-sizing:border-box;">
</td>
</tr>

<tr style="background:#fef3c7;">
<td style="padding:13px; font-weight:bold; color:#b45309; border-radius:8px 0 0 8px;">🔑 Username</td>
<td style="padding:10px;">
<input type="text" placeholder="Create username" required style="width:95%; padding:12px; border:2px solid #fcd34d; border-radius:8px; box-sizing:border-box;">
</td>
</tr>

<tr style="background:#fce7f3;">
<td style="padding:13px; font-weight:bold; color:#be185d; border-radius:8px 0 0 8px;">🔒 Password</td>
<td style="padding:10px;">
<input type="password" placeholder="Create password" required style="width:95%; padding:12px; border:2px solid #f9a8d4; border-radius:8px; box-sizing:border-box;">
</td>
</tr>

<tr style="background:#ede9fe;">
<td style="padding:13px; font-weight:bold; color:#6d28d9; border-radius:8px 0 0 8px;">🔐 Confirm Password</td>
<td style="padding:10px;">
<input type="password" placeholder="Confirm password" required style="width:95%; padding:12px; border:2px solid #c4b5fd; border-radius:8px; box-sizing:border-box;">
</td>
</tr>

<tr style="background:#ffe4e6;">
<td style="padding:13px; font-weight:bold; color:#be123c; border-radius:8px 0 0 8px;">⚧ Gender</td>
<td style="padding:10px;">
<select required style="width:95%; padding:12px; border:2px solid #fda4af; border-radius:8px;">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</td>
</tr>

<tr style="background:#ccfbf1;">
<td style="padding:13px; font-weight:bold; color:#0f766e; border-radius:8px 0 0 8px;">📅 Date of Birth</td>
<td style="padding:10px;">
<input type="date" required style="width:95%; padding:12px; border:2px solid #5eead4; border-radius:8px; box-sizing:border-box;">
</td>
</tr>

<tr style="background:#f1f5f9;">
<td style="padding:13px; font-weight:bold; color:#334155; border-radius:8px 0 0 8px;">🏠 Address</td>
<td style="padding:10px;">
<textarea placeholder="Enter your address" rows="3" required style="width:95%; padding:12px; border:2px solid #94a3b8; border-radius:8px; box-sizing:border-box;"></textarea>
</td>
</tr>

</table>

<div style="text-align:center; margin:20px 0; color:#555;">
<input type="checkbox" required>
I agree to the <span style="color:#764ba2; font-weight:bold;">Terms & Conditions</span>
</div>

<button type="submit" style="width:100%; padding:16px; background:linear-gradient(90deg,#667eea,#764ba2,#ff758c); color:white; border:none; border-radius:10px; font-size:18px; font-weight:bold; cursor:pointer; box-shadow:0 5px 15px rgba(118,75,162,0.4);">
🚀 REGISTER NOW
</button>

<p style="text-align:center; color:#777; margin-top:22px;">
Already have an account?
<a href="#" style="color:#764ba2; font-weight:bold; text-decoration:none;">Login Here</a>
</p>

</form>
</div>
</body>
</html>
