
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase | Online Shopping</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f5fa;
    color: #222;
}

header {
    background: #17152d;
    color: white;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #ffbd59;
}

.search {
    width: 300px;
    padding: 12px;
    border: none;
    border-radius: 6px;
    outline: none;
}

.cart-btn {
    background: #ffbd59;
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.hero {
    background: linear-gradient(120deg, #28234f, #7560bb);
    color: white;
    text-align: center;
    padding: 85px 20px;
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 18px;
    margin-bottom: 25px;
}

.hero button {
    background: #ffbd59;
    padding: 14px 30px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.container {
    padding: 45px 7%;
}

.section-title {
    text-align: center;
    font-size: 30px;
    margin-bottom: 30px;
}

.filters {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 35px;
}

.filters button {
    padding: 11px 22px;
    border: 1px solid #6251a4;
    border-radius: 25px;
    background: white;
    cursor: pointer;
}

.filters button.active,
.filters button:hover {
    background: #6251a4;
    color: white;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
}

.product {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px #00000015;
    transition: 0.3s;
}

.product:hover {
    transform: translateY(-7px);
}

.product img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
    background: #eee;
}

.product-info {
    padding: 18px;
}

.product-info h3 {
    margin-bottom: 10px;
}

.category {
    color: #777;
    font-size: 14px;
}

.price {
    color: #6251a4;
    font-size: 21px;
    font-weight: bold;
    margin: 15px 0;
}

.product-info button {
    width: 100%;
    padding: 12px;
    background: #6251a4;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.product-info button:hover {
    background: #28234f;
}

.cart {
    background: white;
    padding: 25px;
    margin-top: 45px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #00000012;
}

.cart h2 {
    margin-bottom: 20px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 15px 0;
    border-bottom: 1px solid #ddd;
    flex-wrap: wrap;
}

.cart-item button {
    padding: 5px 11px;
    cursor: pointer;
}

.total {
    text-align: right;
    font-size: 23px;
    font-weight: bold;
    margin-top: 25px;
}

.checkout {
    background: #ffbd59;
    padding: 13px 25px;
    border: none;
    border-radius: 6px;
    margin-top: 18px;
    cursor: pointer;
    font-weight: bold;
}

footer {
    background: #17152d;
    color: white;
    text-align: center;
    padding: 30px;
    margin-top: 45px;
}

@media(max-width:600px) {
    header {
        justify-content: center;
    }

    .search {
        width: 100%;
    }

    .hero h1 {
        font-size: 30px;
    }

    .container {
        padding: 30px 5%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">ShopEase.</div>

    <input
        type="text"
        class="search"
        id="search"
        placeholder="Search products..."
        oninput="displayProducts()"
    >

    <button class="cart-btn"
    onclick="document.getElementById('cart').scrollIntoView({behavior:'smooth'})">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>
</header>

<section class="hero">
    <h1>Discover Your Style</h1>
    <p>Explore premium products at amazing prices.</p>

    <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">
        Shop Now
    </button>
</section>

<div class="container" id="shop">

    <h2 class="section-title">Our Products</h2>

    <div class="filters">
        <button class="active" onclick="filterProducts('All',this)">All</button>
        <button onclick="filterProducts('Fashion',this)">Fashion</button>
        <button onclick="filterProducts('Electronics',this)">Electronics</button>
        <button onclick="filterProducts('Shoes',this)">Shoes</button>
        <button onclick="filterProducts('Accessories',this)">Accessories</button>
    </div>

    <div class="products" id="products"></div>

    <div class="cart" id="cart">
        <h2>🛒 Shopping Cart</h2>

        <div id="cartItems">Your cart is empty.</div>

        <div class="total">
            Total: ₹<span id="total">0</span>
        </div>

        <button class="checkout" onclick="checkout()">
            Proceed to Checkout
        </button>
    </div>

</div>

<footer>
    <h3>ShopEase Online Store</h3>
    <p>Quality Products | Best Prices | Easy Shopping</p>
    <br>
    <p>© 2026 ShopEase. All Rights Reserved.</p>
</footer>

<script>

// PRODUCT DATABASE

const products = [

{
id:1,
name:"Premium T-Shirt",
category:"Fashion",
price:599,
image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80"
},

{
id:2,
name:"Wireless Headphones",
category:"Electronics",
price:1499,
image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80"
},

{
id:3,
name:"Running Shoes",
category:"Shoes",
price:1999,
image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80"
},

{
id:4,
name:"Smart Watch",
category:"Electronics",
price:2499,
image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80"
},

{
id:5,
name:"Stylish Sunglasses",
category:"Accessories",
price:799,
image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=600&q=80"
},

{
id:6,
name:"Casual Jacket",
category:"Fashion",
price:1799,
image:"https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=600&q=80"
}

];

let cart = [];
let currentCategory = "All";

// DISPLAY PRODUCTS

function displayProducts() {

let search = document.getElementById("search").value.toLowerCase();

let filtered = products.filter(p =>

(currentCategory === "All" || p.category === currentCategory) &&
p.name.toLowerCase().includes(search)

);

document.getElementById("products").innerHTML =
filtered.length ? filtered.map(p => `

<div class="product">

<img
src="${p.image}"
alt="${p.name}"
onerror="this.onerror=null;this.src='https://placehold.co/600x400?text=Image+Unavailable';"
>

<div class="product-info">

<h3>${p.name}</h3>

<p class="category">${p.category}</p>

<div class="price">₹${p.price}</div>

<button onclick="addToCart(${p.id})">
Add to Cart 🛒
</button>

</div>
</div>

`).join("") : "<p>No products found.</p>";

}

// CATEGORY FILTER

function filterProducts(category,btn) {

currentCategory = category;

document.querySelectorAll(".filters button")
.forEach(b => b.classList.remove("active"));

btn.classList.add("active");

displayProducts();

}

// ADD TO CART

function addToCart(id) {

let item = cart.find(p => p.id === id);

if(item) {
item.quantity++;
}
else {
let product = products.find(p => p.id === id);
cart.push({...product,quantity:1});
}

updateCart();

}

// CHANGE QUANTITY

function changeQuantity(id,change) {

let item = cart.find(p => p.id === id);

if(!item) return;

item.quantity += change;

if(item.quantity <= 0) {
cart = cart.filter(p => p.id !== id);
}

updateCart();

}

// UPDATE CART

function updateCart() {

let cartHTML = "";
let total = 0;
let count = 0;

cart.forEach(item => {

total += item.price * item.quantity;
count += item.quantity;

cartHTML += `

<div class="cart-item">

<span>${item.name}</span>

<span>
<button onclick="changeQuantity(${item.id},-1)">−</button>

${item.quantity}

<button onclick="changeQuantity(${item.id},1)">+</button>
</span>

<strong>₹${item.price * item.quantity}</strong>

</div>

`;

});

document.getElementById("cartItems").innerHTML =
cartHTML || "Your cart is empty.";

document.getElementById("total").innerText = total;

document.getElementById("cartCount").innerText = count;

}

// CHECKOUT

function checkout() {

if(cart.length === 0) {
alert("Your shopping cart is empty!");
return;
}

alert("Thank you! Your demo order has been placed successfully.");

cart = [];

updateCart();

}

// INITIALIZE WEBSITE

displayProducts();

</script>

</body>
</html>
